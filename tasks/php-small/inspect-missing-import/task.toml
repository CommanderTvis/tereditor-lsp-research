selection = "Candidates (harness-independent script, oracle.md): every file under src/ declaring a class or trait that has a `use A\\B\\Name;` import whose short name occurs as a whole word after the imports and is not a type of the file's own directory; the file's subject import is the first such import. 27 candidates sorted by path; seeded shuffle awk 'BEGIN{srand(20261110)}' (macOS awk 20200816, printf %.12f rand(), sort -n); the first 6 files; the first 3 get the defect (the subject import deleted), the last 3 the decoy (the subject import deleted and every use of the short name written fully qualified, which is valid)."
