# kotlin, large: Kotlin/dataframe, a pure-JVM Gradle build (replaces ktor, which has too few modern pull requests that close an issue).
lang = "kotlin"
size = "large"
status = "curated"
repo = "https://github.com/Kotlin/dataframe"
tag = "master-2026-11-17"
commit = "2b425634957a0e974ee1d45896a42e420c261328"
loc = 155341
loc_by_language = { "Kotlin" = 155341, "Java" = 131 }
loc_method = "scc 3.5.0 code lines (harness/size/measure.sh), 2026-11-17"
size_note = "155k Kotlin code lines, inside the large band (140k to 450k) at its lower edge; owner-accepted. No release tag is checked, so the commit of master on 2026-11-17 is pinned."
stripped = ["CLAUDE.md", "AGENTS.md", ".idea"]
task_types = ["rename", "rename-file", "dispatch"]
grade_note = "Gradle 9.9, JDK 21 (the sandbox's; the project's daemon JVM criteria ask for 21). Library modules only: core, dataframe-json, -csv, -arrow, -excel, samples, common-test-utils; the JDBC module (Testcontainers), the compiler plugin and the Jupyter/geo/openapi modules are not tested. The kotlinlang bootstrap Maven repository is reached at prepare and grade-setup time (network on). The project's gradle.properties asks for a 5 GB heap; check.sh and prepare.sh pass 2.5 GB on the command line (nothing is written to the shared Gradle home). Cold prepare plus grade-setup of one commit takes about 10 minutes on 3 CPUs (later commits reuse the downloads, about 5 minutes); a grade run of a task takes 20 to 60 seconds with the grade home's build cache warm. Tests that read from the network (samples Schemas.useInferredSchema and the QuickStartGuide class) fail in the sandbox for every patch; they are listed in each mined task's p2p-exclude.txt, taken from a run of the reference solution. The repository commits KoDEx-processed copies of the sources under core/generated-sources (not compiled; the build regenerates them): the synthetic tasks leave them alone and say so."

