# Kotlin, small: slackhq/compose-lints, Android Lint checks for Jetpack Compose (Slack). Pure JVM Gradle build with
# one module: a detector per rule over Kotlin PSI and UAST, shared helpers in util/, and lint's own test harness
# (lint-tests) for every rule. Replaces kotlin-result (a Kotlin Multiplatform build with almost no modern pull requests
# that close issues, docs/MEMORIZATION.md).
