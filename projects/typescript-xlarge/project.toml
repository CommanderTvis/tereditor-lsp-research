# TypeScript, xlarge: payload (payloadcms/payload), a headless CMS framework. A pnpm monorepo of about 50 packages
# (payload core, ui, next, graphql, db adapters on a shared drizzle layer, richtext-lexical, plugins, storage adapters)
# with a large integration test suite under test/. Collections, fields, hooks and access functions are configured through
# deeply generic types; many packages declare same-named helpers.
