size = "xlarge"
status = "postponed"
repo = "https://github.com/payloadcms/payload"
commit = "ec351643011603cf75dc91db5d03f80ff120f1e9"
commit_date = "2026-10-30"
loc = 855853
loc_by_language = { "TypeScript" = 843778, "TypeScript Typings" = 12075 }
loc_method = "scc 3.5.0 code lines, docs/PROJECTS.md (sh harness/size/measure.sh); tests included, no release tag pinned (dated commit of the default branch, version 4.0.0-beta.6)"
stripped = ["AGENTS.md", ".claude/", ".claude-plugin/", ".cursor/", ".codex/", ".agents/", ".mcp.json", ".vscode/", ".idea/ and other agent or editor instruction files where present (harness/env/project.sh)"]
task_types = ["impls", "dispatch", "callers", "pr", "pr", "pr"]
# Tests run with Node 24 (study-node24 of the grading toolchain) through vitest on sqlite (libsql) only: no database
