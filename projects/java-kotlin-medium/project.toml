# Java+Kotlin, medium: pact-foundation/pact-jvm, consumer-driven contract testing for the JVM. A multi-module Gradle build:
# the model, matchers and broker client in Kotlin, the consumer DSL in Kotlin and Java, JUnit integrations in Java, the
# provider verification in Kotlin, and a large Spock (Groovy) test suite. Replaces moshi (no modern pull requests that
# close issues, docs/MEMORIZATION.md).
