size = "medium"
status = "curated"
repo = "https://github.com/pact-foundation/pact-jvm"
tag = "4_7_7"
commit = "5658d0c9e1c3ac8bff5db4b7ea33bc504093f226"
loc = 63442
stripped = ["CLAUDE.md", ".github/copilot-instructions.md"]
loc_by_language = { "Kotlin" = 47248, "Java" = 16194 }
loc_method = "scc 3.5.0 code lines, docs/PROJECTS.md"
size_note = "Kotlin 74 percent and Java 26 percent of the 63.4k lines; the Groovy tests (50.9k lines of Spock specs) and Gradle scripts are not counted, per the size measure. Modules whose tests need native libraries or services (pact-jvm-server, the Pact FFI based compatibility suite, provider:lein, spring) are not built or tested by check.sh."
